<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aplikasi Data Kendaraan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid app-wrapper">
    <div class="app-card">

        <div class="app-header">
            <span class="app-logo"></span>
            <h1 class="app-title">Aplikasi Data Kendaraan</h1>
        </div>

        <!-- Panel filter, berlatar oranye muda sesuai mockup.
             Tombol Search dan Add berada di dalam panel, rata kanan bawah. -->
        <div class="filter-panel">
            <div class="filter-fields">
                <label for="filterNoRegistrasi" class="form-label filter-label">No Registrasi</label>
                <input type="text" class="form-control" id="filterNoRegistrasi" autocomplete="off">

                <label for="filterNamaPemilik" class="form-label filter-label mt-3">Nama Pemilik</label>
                <input type="text" class="form-control" id="filterNamaPemilik" autocomplete="off">
            </div>

            <div class="action-bar">
                <button type="button" class="btn btn-primary btn-aksi" id="btnSearch">Search</button>
                <button type="button" class="btn btn-primary btn-aksi" id="btnAdd">Add</button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-data align-middle">
                <thead>
                <tr>
                    <th class="kolom-no">No</th>
                    <th>No Registrasi</th>
                    <th>Nama Pemilik</th>
                    <th>Merk Kendaraan</th>
                    <th>Tahun Pembuatan</th>
                    <th>Kapasitas</th>
                    <th>Warna</th>
                    <th>Bahan Bakar</th>
                    <th class="kolom-action">Action</th>
                </tr>
                </thead>
                <tbody id="tabelBody"></tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-2">
            <small class="text-muted" id="infoData"></small>
            <nav>
                <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
            </nav>
        </div>

    </div>
</div>

<!-- Modal konfirmasi hapus. Memakai modal Bootstrap, bukan confirm() bawaan browser. -->
<div class="modal fade" id="modalHapus" tabindex="-1" aria-labelledby="modalHapusLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-hapus">
            <div class="modal-body">
                <p class="mb-3" id="modalHapusLabel"></p>
                <div class="d-flex justify-content-center gap-2">
                    <button type="button" class="btn btn-primary btn-modal" id="btnHapusOk">OK</button>
                    <button type="button" class="btn btn-secondary btn-modal" data-bs-dismiss="modal">Batal</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Pemberitahuan singkat setelah hapus berhasil atau gagal -->
<div class="toast-wrapper">
    <div class="alert d-none" id="pesanAksi" role="alert"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/monitoring.js"></script>
</body>
</html>
