spring.application.name=aplikasi-data-kendaraan
server.port=8080

# ---------------------------------------------------------------------------
# Database aktif: H2 file-mode
# File database disimpan di ./data/kendaraan.mv.db sehingga data bertahan
# antar restart. Untuk mengembalikan data ke kondisi awal, hentikan aplikasi,
# hapus direktori ./data, lalu jalankan ulang aplikasi.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/kendaraan
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Struktur tabel dibuat lewat schema.sql (CREATE TABLE IF NOT EXISTS),
# bukan oleh Hibernate. Data awal disisipkan oleh DataSeeder, bukan data.sql.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# H2 console: http://localhost:8080/h2-console
# JDBC URL yang diisikan di console: jdbc:h2:file:./data/kendaraan
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

